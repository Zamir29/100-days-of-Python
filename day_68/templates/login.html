{% extends "base.html" %} {% block content %}

<div class="box">
  <h1>Login</h1>
  <!-- TODO: Use Message Flashing to display feedback to the user with a <p> -->
  <!-- Set a variable for the list of flashes messages -->
  {% with messages = get_flashed_messages() %}
  <!-- If the there are messages -->
  {% if messages %}
  <ul class="flashes" style="list-style-type: none; margin: 0; padding-left: 0;">
    {% for message in messages %}
    <li><p>{{ message }}</p></li>

    {% endfor %}
  </ul>
  {% endif %}
  <!-- Close the with tag -->
  {% endwith %}
  <form action="{{ url_for('login') }}" method="post" novalidate="True">
    <input type="text" name="email" placeholder="Email" value="{{ request.args.get('email', '') }}" required="required" />
    <input
      type="password"
      name="password"
      placeholder="Password"
      required="required"
    />
    <button type="submit" class="btn btn-primary btn-block btn-large">
      Let me in.
    </button>
  </form>
</div>

{% endblock %}
