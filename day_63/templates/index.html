<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Library</title>
  </head>
  <body>
    <h1>My Library</h1>
    {% if not all_books %}
    <p>Your library is empty</p>
    {% else %}
    <ul>
      {% for book in all_books %}

        <li>{{ book.title }} - {{ book.author }} - {{ book.rating }}
          <button type="submit" style="padding: 5px;"><a href="{{ url_for('edit', book_id=book.id)}}" style="color: white;">Edit Rating</a></button></li>
      {% endfor %}
    </ul>
    {% endif %}
    <a href="{{ url_for('add') }}">Add New Book</a>
  </body>
</html>
