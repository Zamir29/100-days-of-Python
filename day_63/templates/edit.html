<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Edit Rating</title>
  </head>
  <body>
    <form action="" method="POST">
      <p><strong>{{ book.title }}</strong> - {{ book.author }}</p>
      <label>Rating</label>
      <input name="rating" type="number" step="0.1" min="0" max="10" value="{{ book.rating }}"/>
      <button type="submit">Update Rating</button>
    </form>
  </body>
</html>
